<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">AIRYS IT Solutions</title>
<desc id="desc">AIRYS IT Solutions logo in metallic blue, silver and warm gold.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5f2e8"/>
    <stop offset=".28" stop-color="#9bb4c1"/>
    <stop offset=".62" stop-color="#314b5a"/>
    <stop offset="1" stop-color="#8da7b4"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0c7"/>
    <stop offset=".28" stop-color="#ffad4d"/>
    <stop offset=".62" stop-color="#d87522"/>
    <stop offset="1" stop-color="#ffd28b"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g transform="translate(25 45)">
  <path d="M20 285 L105 70 L190 285 L145 245 L105 145 L65 245 Z" fill="url(#metal)"/>
  <path d="M15 285 C58 225 79 205 105 205 C132 205 155 225 200 285 C159 261 132 247 105 247 C79 247 52 261 15 285Z" fill="url(#gold)" filter="url(#glow)"/>
</g>
<text x="220" y="265" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="210" font-weight="900" letter-spacing="8" fill="url(#metal)">AIRYS</text>
<g fill="none" stroke="url(#gold)" stroke-width="3">
  <path d="M225 315 H430"/><path d="M865 315 H1080"/>
</g>
<text x="475" y="330" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="500" letter-spacing="16" fill="url(#gold)">IT SOLUTIONS</text>
</svg>